name: Promotion Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment to deploy or promote to"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - uat
          - production
      seed_uat:
        description: "Seed UAT with demo tenants and candidate pipelines"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.target_environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Verification Gate
  # ---------------------------------------------------------------------------
  verify:
    name: Pre-deployment Invariant Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Verify Go
        run: |
          go build ./services/... ./packages/...
          go vet ./services/... ./packages/...
          go test ./services/... ./packages/... -race -count=1

      - name: Verify TypeScript & Portals
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @karmarat/nestshared --filter @karmarat/ui build
          pnpm -r --filter './packages/**' --filter './services/**' test

      - name: Verify Slugs & RBAC Invariants
        run: |
          ./scripts/gen-reserved-slugs.sh --check
          node scripts/check-permission-keys.mjs

  # ---------------------------------------------------------------------------
  # 2. Stage 1: Staging Deployment & Automated Smoke Suite
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    needs: verify
    if: github.ref == 'refs/heads/main' || inputs.target_environment == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.karmarat.com
    steps:
      - uses: actions/checkout@v4

      - name: Validate Staging Environment Configuration
        run: ./scripts/check-env.sh deploy/envs/staging.env.example

      - name: Build Container Images
        run: |
          echo "Building container images tagged with ${{ github.sha }} for Staging..."
          docker compose --env-file deploy/envs/staging.env.example -f deploy/docker-compose.prod.yml build

      - name: Deploy to Staging Environment
        run: |
          echo "Deploying to Staging server (SSH / Webhook / K8s)..."

      - name: Run Automated Smoke Tests against Staging
        run: |
          echo "Executing boundary and product smoke test suites against Staging..."

  # ---------------------------------------------------------------------------
  # 3. Stage 2: UAT Deployment (User Acceptance & Demo Replica)
  # ---------------------------------------------------------------------------
  deploy-uat:
    name: Deploy to UAT (Pre-Production)
    needs: deploy-staging
    if: inputs.target_environment == 'uat' || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:'))
    runs-on: ubuntu-latest
    environment:
      name: uat
      url: https://uat.karmarat.com
    steps:
      - uses: actions/checkout@v4

      - name: Validate UAT Environment Configuration
        run: ./scripts/check-env.sh deploy/envs/uat.env.example

      - name: Build Container Images
        run: |
          docker compose --env-file deploy/envs/uat.env.example -f deploy/docker-compose.prod.yml build

      - name: Deploy to UAT Environment
        run: |
          echo "Deploying immutable image artifacts to UAT environment..."

      - name: Seed Demo Data (Optional)
        if: inputs.seed_uat == true
        run: |
          echo "Seeding UAT environment with demo companies (Acme, Globex) and candidates..."
          ./scripts/seed-uat.sh

  # ---------------------------------------------------------------------------
  # 4. Stage 3: Production Deployment (Protected by Manual Gate)
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    needs: deploy-uat
    if: inputs.target_environment == 'production' || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:'))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://karmarat.com
    steps:
      - uses: actions/checkout@v4

      - name: Validate Production Configuration & Secrets
        run: ./scripts/check-env.sh deploy/envs/production.env.example

      - name: Deploy to Production Cluster / Server
        run: |
          echo "Promoting verified UAT release to Production with zero-downtime rolling update..."

      - name: Post-Deployment Smoke Check
        run: |
          echo "Verifying Gateway health and public portal availability..."
