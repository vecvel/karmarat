    image: karmarat/jobs:dev
    container_name: karmarat-jobs
    restart: unless-stopped
    depends_on:
      <<: *infra-ready
    environment:
      <<: [*service-env, *service-urls]
      # Spelled out rather than defaulted from the service name, so a
      # misconfiguration fails loudly instead of silently sharing a schema.
      POSTGRES_DB: jobs
      JOBS_HTTP_PORT: 8085
    ports:
      - "${JOBS_HTTP_PORT:-8085}:8085"

  applications:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.go-service
      args:
        SERVICE: applications
        PORT: "8086"
    image: karmarat/applications:dev
    container_name: karmarat-applications
    restart: unless-stopped
    depends_on:
      <<: *infra-ready
    environment:
      <<: [*service-env, *service-urls]
      # Spelled out rather than defaulted from the service name, so a
      # misconfiguration fails loudly instead of silently sharing a schema.
      POSTGRES_DB: applications
      APPLICATIONS_HTTP_PORT: 8086
    ports:
