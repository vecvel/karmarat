        PORT: "8094"
    image: karmarat/audit:dev
    container_name: karmarat-audit
    restart: unless-stopped
    depends_on:
      <<: *infra-ready
    environment:
      <<: [*service-env, *service-urls]
      # Spelled out rather than defaulted from the service name, so a
