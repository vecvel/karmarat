        PORT: "8087"
    image: karmarat/candidates:dev
    container_name: karmarat-candidates
    restart: unless-stopped
    depends_on:
      <<: *infra-ready
    environment:
      <<: [*service-env, *service-urls]
      # Spelled out rather than defaulted from the service name, so a
      # misconfiguration fails loudly instead of silently sharing a schema.
      POSTGRES_DB: candidates
      CANDIDATES_HTTP_PORT: 8087
    ports:
