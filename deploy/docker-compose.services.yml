  notifications:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.go-service
      args:
        SERVICE: notifications
        PORT: "8089"
    image: karmarat/notifications:dev
    container_name: karmarat-notifications
    restart: unless-stopped
    depends_on:
      <<: *infra-ready
    environment:
      <<: [*service-env, *service-urls]
      # Spelled out rather than defaulted from the service name, so a
      # misconfiguration fails loudly instead of silently sharing a schema.
      POSTGRES_DB: notifications
      NOTIFICATIONS_HTTP_PORT: 8089
      # Mailpit captures everything in development; nothing leaves the host.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_TLS: ${SMTP_TLS:-false}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-no-reply@karmarat.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Karmarat}
      COMPANY_PORTAL_URL: ${COMPANY_PORTAL_URL:-http://localhost:3000}
      JOBS_PORTAL_URL: ${JOBS_PORTAL_URL:-http://localhost:3001}
      ROOT_PORTAL_URL: ${ROOT_PORTAL_URL:-http://localhost:3002}
    ports:
      - "${NOTIFICATIONS_HTTP_PORT:-8089}:8089"

  support:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.nest-service
      args:
        SERVICE: support
        PORT: "8090"
    image: karmarat/support:dev
    container_name: karmarat-support
    restart: unless-stopped
    depends_on:
      <<: *infra-ready
    environment:
      <<: [*service-env, *service-urls]
      # Spelled out rather than defaulted from the service name, so a
