  gateway:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.go-service
      args:
        SERVICE: gateway
        PORT: "8080"
    image: karmarat/gateway:dev
    container_name: karmarat-gateway
    restart: unless-stopped
    # The gateway proxies to the others. Starting it first would answer real
    # requests with 502s while the rest come up.
    depends_on:
      <<: *infra-ready
      identity:
        condition: service_started
    environment:
      <<: [*service-env, *service-urls]
      # Verification only — the gateway never signs, so it holds no private key.
      # The private key is still on the mount; making that a separate mount is
      # the obvious hardening step once this runs anywhere but a laptop.
      JWT_PRIVATE_KEY_PATH: /run/keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt-public.pem

      GATEWAY_HTTP_PORT: 8080
      GATEWAY_RATE_LIMIT: ${GATEWAY_RATE_LIMIT:-300}
      GATEWAY_RATE_WINDOW: ${GATEWAY_RATE_WINDOW:-1m}
    volumes:
      - ./keys:/run/keys:ro
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:8080"
