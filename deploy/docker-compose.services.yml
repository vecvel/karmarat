  payments:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.nest-service
      args:
        SERVICE: payments
        PORT: "8084"
    image: karmarat/payments:dev
    container_name: karmarat-payments
    restart: unless-stopped
    depends_on:
