# Karmarat application services (local containerised run).
#
# This file is an OVERLAY on deploy/docker-compose.yml, not a replacement: it
# adds the application services and depends on the infrastructure defined there.
# Both files declare the same project name, so they merge into one stack.
#
#   docker compose -f deploy/docker-compose.yml \
#                  -f deploy/docker-compose.services.yml up -d --build
#
#   docker compose -f deploy/docker-compose.yml \
#                  -f deploy/docker-compose.services.yml logs -f gateway
#
#   docker compose -f deploy/docker-compose.yml \
#                  -f deploy/docker-compose.services.yml down
#
# Run `make keys` first: the gateway and identity read the RS256 keypair from
# deploy/keys, which is mounted read-only and never baked into an image.
#
# Hostnames are compose service names, so nothing here points at localhost — a
# container's localhost is itself. Ports are published for the host only so the
# portals and `make smoke` can reach a service directly.
#
# Infrastructure alone (the default for `make dev`, which runs the services on
# the host) is still just `docker compose -f deploy/docker-compose.yml up -d`.
#
# The shared blocks below are YAML anchors. Fourteen services differing in three
# lines each is how a file like this drifts: one gets a stale NATS url, nobody
# notices until its consumer stops. Here a change to the platform's environment
# is one edit.

name: karmarat

x-service-env: &service-env
  PLATFORM_ENV: ${PLATFORM_ENV:-development}
  PLATFORM_HOSTNAME: ${PLATFORM_HOSTNAME:-karmarat.local}
  LOG_LEVEL: ${LOG_LEVEL:-info}

  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-karmarat}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karmarat}
  POSTGRES_SSLMODE: disable

  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-karmarat}

  NATS_URL: nats://nats:4222

  # Guards every /internal/* endpoint. Empty leaves them open inside the compose
  # network, which is fine on a laptop and is not fine anywhere else.
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}

  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}

# Where each service reaches the others. Every service gets the whole map rather
# than a hand-picked subset: the subset is what goes stale when a service starts
# calling a neighbour it did not call before, and the failure is a 502 at
# runtime rather than anything a review would catch.
x-service-urls: &service-urls
  IDENTITY_URL: http://identity:8081
  COMPANIES_URL: http://companies:8082
  SUBSCRIPTIONS_URL: http://subscriptions:8083
  PAYMENTS_URL: http://payments:8084
  JOBS_URL: http://jobs:8085
  APPLICATIONS_URL: http://applications:8086
  CANDIDATES_URL: http://candidates:8087
  MESSAGING_URL: http://messaging:8088
  NOTIFICATIONS_URL: http://notifications:8089
  SUPPORT_URL: http://support:8090
  ADMIN_URL: http://admin:8091
  INTERVIEWS_URL: http://interviews:8092
  OFFERS_URL: http://offers:8093
  AUDIT_URL: http://audit:8094

x-infra-ready: &infra-ready
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  nats:
    condition: service_healthy

services:
  identity:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.go-service
      args:
        SERVICE: identity
        PORT: "8081"
    image: karmarat/identity:dev
    container_name: karmarat-identity
    restart: unless-stopped
    depends_on:
      <<: *infra-ready
    environment:
      <<: [*service-env, *service-urls]
      # Spelled out rather than defaulted from the service name, so a
      # misconfiguration fails loudly instead of silently sharing a schema.
      POSTGRES_DB: identity
      IDENTITY_HTTP_PORT: 8081
      JWT_PRIVATE_KEY_PATH: /run/keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt-public.pem
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}

      # First run only. Once the administrator has signed in these can be
      # dropped; the provisioner is a no-op afterwards.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Platform Administrator}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - ./keys:/run/keys:ro
    ports:
      - "${IDENTITY_HTTP_PORT:-8081}:8081"

  companies:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.nest-service
      args:
        SERVICE: companies
        PORT: "8082"
    image: karmarat/companies:dev
    container_name: karmarat-companies
    restart: unless-stopped
    depends_on:
      <<: *infra-ready
    environment:
      <<: [*service-env, *service-urls]
      # Spelled out rather than defaulted from the service name, so a
      # misconfiguration fails loudly instead of silently sharing a schema.
      POSTGRES_DB: companies
      COMPANIES_HTTP_PORT: 8082
    ports:
      - "${COMPANIES_HTTP_PORT:-8082}:8082"

  subscriptions:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.nest-service
      args:
        SERVICE: subscriptions
        PORT: "8083"
    image: karmarat/subscriptions:dev
    container_name: karmarat-subscriptions
    restart: unless-stopped
    depends_on:
      <<: *infra-ready
    environment:
      <<: [*service-env, *service-urls]
      # Spelled out rather than defaulted from the service name, so a
      # misconfiguration fails loudly instead of silently sharing a schema.
      POSTGRES_DB: subscriptions
      SUBSCRIPTIONS_HTTP_PORT: 8083
    ports:
