  messaging:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.go-service
      args:
        SERVICE: messaging
        PORT: "8088"
    image: karmarat/messaging:dev
    container_name: karmarat-messaging
    restart: unless-stopped
    depends_on:
      <<: *infra-ready
    environment:
      <<: [*service-env, *service-urls]
